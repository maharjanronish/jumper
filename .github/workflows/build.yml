name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure build-tools 35 + platform 34
        run: |
          yes | sdkmanager "build-tools;35.0.0" "platforms;android-34" > /dev/null || true

      - name: Build signed APK
        run: |
          chmod +x scripts/build_apk.sh
          scripts/build_apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jumper-APK
          path: Jumper.apk

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" Jumper.apk \
            --title "Jumper ${GITHUB_REF#refs/tags/v}" \
            --generate-notes || true
